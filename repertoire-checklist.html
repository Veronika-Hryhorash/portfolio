<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Репертуар — чекліст</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--fg:#1d1b18;--mut:#7a746b;--line:#e8e3dc;--acc:#8a5a2b;--rm:#b4442f}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--card:#1f1d1a;--fg:#ece7df;--mut:#9a9389;--line:#2f2c28;--acc:#d9a56a;--rm:#e0735c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:18px;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],select{flex:1 1 180px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
button{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}
.tabs button[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.stats{color:var(--mut);font-size:13px;margin-top:8px}
main{padding:8px 16px 60px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:18px 0 4px;font-weight:600}
label.item{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer}
label.item:hover{background:var(--card)}
label.item input{margin-top:3px;width:18px;height:18px;accent-color:var(--rm);flex:none}
.t{font-weight:500}
.m{color:var(--mut);font-size:12.5px}
label.item.off .t{text-decoration:line-through;color:var(--rm)}
label.item.off .m{opacity:.6}
input[type=text]{flex:1 1 160px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
#addedBox{margin-top:10px;border:1px dashed var(--acc);border-radius:8px;padding:4px 12px 8px}
#addedBox .a{display:flex;gap:8px;align-items:center;padding:4px 0}
#addedBox .a span{flex:1}
#addedBox .a button{padding:2px 8px}
.empty{color:var(--mut);padding:30px 0;text-align:center}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Репертуар — чекліст</h1>
  <div class="row">
    <input type="search" id="q" placeholder="Пошук: назва або композитор…">
    <select id="cat"><option value="">Усі жанри</option></select>
  </div>
  <div class="row tabs" style="margin-top:8px">
    <button data-f="all" aria-pressed="true">Усі</button>
    <button data-f="keep">Залишені</button>
    <button data-f="off">Прибрані</button>
    <span style="flex:1"></span>
    <button id="expKeep">⬇ .txt залишені</button>
    <button id="expOff">⬇ .txt прибрані</button>
    <button id="reset" title="Повернути початкову позначку">↺</button>
  </div>
  <form class="row" id="addForm" style="margin-top:8px">
    <input type="text" id="addComp" placeholder="Додати: композитор / виконавець" required>
    <input type="text" id="addTitle" placeholder="Назва твору" required>
    <button type="submit">＋ Додати</button>
    <button type="button" id="expAdd">⬇ added.txt</button>
  </form>
  <div class="stats" id="stats"></div>
</div></header>
<main class="wrap"><div id="addedBox" hidden></div><div id="list"></div></main>

  const seen = new Set(JSON.parse(localStorage.getItem(SEEN_KEY)) || saved || []);
  off = new Set(saved || []);
  INITIAL_OFF.forEach(id => { if (!seen.has(id)) off.add(id); });
} catch { off = new Set(INITIAL_OFF); }
const save = () => { try {
  localStorage.setItem(KEY, JSON.stringify([...off]));
  localStorage.setItem(SEEN_KEY, JSON.stringify(INITIAL_OFF));
} catch {} };
save();

let filter = 'all';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase();

Object.keys(CAT).forEach(k => $('#cat').insertAdjacentHTML('beforeend', `<option value="${k}">${CAT[k]}</option>`));

function meta(d){ return [d.catalogue, d.year, CAT[d.category]].filter(Boolean).join(' · '); }

function render(){
  const q = norm($('#q').value.trim()), cat = $('#cat').value;
  const items = DATA.filter(d =>
    (filter === 'all' || (filter === 'off') === off.has(d.id)) &&
    (!cat || d.category === cat) &&
    (!q || norm(d.composer + ' ' + d.title).includes(q)));
  let html = '', last = null;
  for (const d of items){
    if (d.composer !== last){ html += `<h2>${esc(d.composer)}</h2>`; last = d.composer; }
    const o = off.has(d.id);
    html += `<label class="item${o?' off':''}"><input type="checkbox" data-id="${d.id}"${o?' checked':''}>
      <div><div class="t">${esc(d.title)}</div><div class="m">${esc(meta(d))}</div></div></label>`;
  }
  $('#list').innerHTML = html || '<div class="empty">Нічого не знайдено</div>';
  $('#stats').textContent = `Усього ${DATA.length} · залишено ${DATA.length - off.size} · прибрано ${off.size} · показано ${items.length}`;
}

$('#list').addEventListener('change', e => {
  const id = e.target.dataset.id; if (!id) return;
  e.target.checked ? off.add(id) : off.delete(id);
  e.target.closest('label').classList.toggle('off', e.target.checked);
  save();
  $('#stats').textContent = `Усього ${DATA.length} · залишено ${DATA.length - off.size} · прибрано ${off.size}`;
});
$('#q').addEventListener('input', render);
$('#cat').addEventListener('change', render);
document.querySelectorAll('.tabs [data-f]').forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll('.tabs [data-f]').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});

function download(txt, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type:'text/plain;charset=utf-8'}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function exportTxt(wantOff, name){
  const list = DATA.filter(d => off.has(d.id) === wantOff);
  let txt = wantOff ? 'Прибери ці твори з репертуару:\n\n' : '', last = null;
  for (const d of list){
    if (d.composer !== last){ txt += (last === null ? '' : '\n') + d.composer + '\n'; last = d.composer; }
    txt += '- ' + d.title + (d.catalogue || d.year ? ` (${[d.catalogue, d.year].filter(Boolean).join(', ')})` : '') + '\n';
  }
  download(txt, name);
}
$('#expKeep').onclick = () => exportTxt(false, 'repertoire.txt');
$('#expOff').onclick = () => exportTxt(true, 'repertoire-removed.txt');
$('#reset').onclick = () => { if (confirm('Скинути позначки до початкового стану?')) { off = new Set(INITIAL_OFF); save(); render(); } };

/* ---- Додані твори (прив'язані до data/repertoire.json) ---- */
const ADD_KEY = 'repertoire-added-v1';
const key = (c, t) => norm(c + '|' + t).replace(/[^a-z0-9\u0400-\u04ff|]+/g, '');
let added = [];
try { added = JSON.parse(localStorage.getItem(ADD_KEY)) || []; } catch {}
const saveAdded = () => { try { localStorage.setItem(ADD_KEY, JSON.stringify(added)); } catch {} };
function renderAdded(){
  const box = $('#addedBox');
  box.hidden = !added.length;
  box.innerHTML = '<h2>Додані (' + added.length + ')</h2>' + added.map((a, i) =>
    `<div class="a"><span>${esc(a.composer)} — ${esc(a.title)}</span><button data-rm="${i}" title="Прибрати зі списку доданих">✕</button></div>`).join('');
}
// Прибирає з added все, що вже є в репертуарі
function syncAdded(){
  const have = new Set(DATA.map(d => key(d.composer, d.title)));
  const before = added.length;
  added = added.filter(a => !have.has(key(a.composer, a.title)));
  if (added.length !== before) saveAdded();
}
$('#addForm').addEventListener('submit', e => {
  e.preventDefault();
  const composer = $('#addComp').value.trim(), title = $('#addTitle').value.trim();
  if (!composer || !title) return;
  const k = key(composer, title);
  if (!DATA.some(d => key(d.composer, d.title) === k) && !added.some(a => key(a.composer, a.title) === k)) added.push({composer, title});
  saveAdded(); $('#addTitle').value = ''; $('#addTitle').focus(); renderAdded();
});
$('#addedBox').addEventListener('click', e => {
  const i = e.target.dataset.rm; if (i == null) return;
  added.splice(+i, 1); saveAdded(); renderAdded();
});
$('#expAdd').onclick = () => {
  if (!added.length) { alert('Немає доданих творів'); return; }
  const g = new Map();
  added.forEach(a => { g.has(a.composer) || g.set(a.composer, []); g.get(a.composer).push(a.title); });
  let txt = 'Додай ці твори до репертуару:\n\n';
  txt += [...g].map(([c, ts]) => c + '\n' + ts.map(t => '- ' + t).join('\n')).join('\n\n') + '\n';
  download(txt, 'added.txt');
};

// Оновлюємо DATA з data/repertoire.json (працює через http; з file:// лишається вбудована копія)
fetch('data/repertoire.json', {cache:'no-cache'}).then(r => r.ok ? r.json() : Promise.reject()).then(j => {
  const fresh = j.map(w => ({id: w.id, composer: w.composer.en || Object.values(w.composer)[0], title: w.title.en || Object.values(w.title)[0],
    catalogue: w.catalogue || '', year: w.year, category: w.category}));
  if (fresh.length) DATA = fresh;
}).catch(() => {}).finally(() => { syncAdded(); renderAdded(); render(); });
</script>
</body>
</html>
